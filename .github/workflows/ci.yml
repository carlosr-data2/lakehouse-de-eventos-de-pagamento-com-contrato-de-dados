# Esta pasta (.github/workflows/) e vigiada pelo GitHub: cada .yml aqui e um
# workflow que roda sozinho nos servidores deles, nos gatilhos declarados em
# "on:". Nada a instalar -- o arquivo estar no repo e o que liga a esteira.
#
# Vocabulario minimo pra ler este arquivo:
#   on:            gatilhos (push na main e todo pull request)
#   jobs:          cada job nasce numa VM NOVA e descartavel (o "runner");
#                  nada sobrevive entre jobs -- por isso todo job refaz o
#                  checkout. "Passou no CI" = funciona numa maquina limpa.
#   needs:         encadeia jobs (unit so roda se static passar) -- a
#                  escada do mais barato pro mais caro
#   steps:         sequencia dentro do job. "uses:" puxa action pronta do
#                  marketplace (checkout, setup-python...; o @v4 e pinning),
#                  "with:" parametriza, "run:" e shell puro
#   services:      containers auxiliares que sobem junto do job (LocalStack)
#   if: always():  roda o step mesmo com falha antes (o destroy da infra)
#
# Anatomia em prosa e decisoes: docs/CI.md.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # Estagio 1: validacao estatica. Segundos de execucao, pega erro trivial
  # antes de qualquer coisa cara subir.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - name: terraform fmt
        run: terraform -chdir=infra fmt -check -diff -recursive
      - name: terraform validate
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: lint python
        run: |
          pip install ruff==0.16.1
          ruff check jobs ingest lambda ci tests

  # Estagio 2: testes unitarios do contrato de dados. SparkSession local,
  # sem infraestrutura, sem S3 - por isso cabem em cada commit.
  unit:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest
        run: |
          pip install pyspark==3.5.1 pytest
          python -m pytest tests -q

  # Estagio 3: integracao real. LocalStack como service container, Terraform
  # aplicado de verdade e teste de fumaca. E o que prova que a infra sobe.
  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      localstack:
        image: localstack/localstack:3.8
        ports: ["4566:4566"]
        env:
          SERVICES: s3,iam,sts,dynamodb,lambda,stepfunctions,sns,sqs,logs,kinesis,firehose,cloudwatch,events
        # a Lambda do LocalStack executa cada função num container próprio --
        # sem o socket do Docker do runner montado, CreateFunction fica em
        # estado Failed ("Docker not available") e o apply quebra.
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: aguarda localstack
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:4566/_localstack/health | grep -q '"s3"' && break
            sleep 3
          done
      - name: terraform apply
        run: |
          terraform -chdir=infra init
          terraform -chdir=infra apply -auto-approve
      - name: smoke test
        run: |
          pip install boto3
          python ci/smoke_test.py --endpoint http://localhost:4566
      - name: terraform destroy
        if: always()
        run: terraform -chdir=infra destroy -auto-approve
